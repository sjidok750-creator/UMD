name: Windows build and verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare desktop for UI layout tests
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "Desktop before: $([System.Windows.Forms.SystemInformation]::VirtualScreen)"
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Write-Host "Desktop after: $([System.Windows.Forms.SystemInformation]::VirtualScreen)"
      - name: Build and verify
        shell: powershell
        run: .\verify-all.ps1
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-output
          path: artifacts/
      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: PM-Studio-Windows
          path: |
            PMStudio.exe
            PMStudio.Core.dll
            PMStudio.Api.exe
            examples/*.pmproj.json
            README.md
            API.md
            GUIDED-INPUT.md
